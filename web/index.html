<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register · Example Conf</title>

<!--
  Dash0 Web SDK + session replay.

  Every frontend serves this file as its registration page and fills in the
  config placeholder below with values from the root .env
  (endpoint, browser auth token, dataset) plus its own website service name.
  The file is re-read on every request, so edits show up on the next reload,
  without restarting the frontend.

  The auth token ends up in the HTML every visitor downloads. That is normal
  for browser telemetry, which is why .env asks for a SEPARATE, ingest-only
  token (DASH0_WEB_AUTH_TOKEN) instead of the one your backends use.
-->
<script>
  window.__REGISTRATION_CONFIG__ = __DASH0_BROWSER_CONFIG__;

  // Dash0 loader stub: queues dash0(...) calls until the SDK script has loaded.
  (function (d, a, s, h, z, e, r, o) {
    d[a] ||
      ((z = d[a] =
        function () {
          h.push(arguments);
        }),
      (z._t = new Date()),
      (z._v = 1),
      (h = z._q = []));
  })(window, "dash0");

  (function (c) {
    dash0("init", {
      serviceName: c.serviceName,
      environment: "workshop",
      endpoint: { url: c.endpointUrl, authToken: c.authToken, dataset: c.dataset },

      sessionRecording: {
        // Record every session. In production you would sample, e.g. 10.
        samplingRate: 100,

        // Inputs are masked by default (maskAllInputs: true): whatever a visitor
        // types leaves the browser as ****. Page TEXT is not masked by default.

        // EXERCISE 4 — the promo code is not personal data, and you need to see
        // what people typed to debug the promo bug. Uncomment to let that one
        // field through while every other input stays masked:
        //
        // maskInputFn: function (text, el) {
        //   return el && el.id === "promoCode" ? text : "*".repeat(text.length);
        // },
      },
    });
  })(window.__REGISTRATION_CONFIG__);
</script>
<!-- The SDK, then the session replay recorder (an opt-in add-on bundle). Pinned for a reproducible workshop. -->
<script defer crossorigin="anonymous" src="https://unpkg.com/@dash0/sdk-web@0.28.3/dist/dash0.iife.js"></script>
<script defer crossorigin="anonymous" src="https://unpkg.com/@dash0/sdk-web@0.28.3/dist/dash0-session-recording.iife.js"></script>
<!-- The page logic, including the deliberate frontend bugs. -->
<script defer src="/static/registration.js"></script>

<style>
  :root { --ink:#0b1020; --accent:#ff6a13; --accent2:#1f6feb; --line:#e5e7eb; --muted:#5b6472; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:linear-gradient(135deg,#0b1020,#13224a); color:var(--ink); min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.35); width:100%; max-width:460px; overflow:hidden; }
  .head { background:linear-gradient(135deg,var(--accent),#ff8f4d); color:#fff; padding:28px 28px 22px; }
  .head.ok { background:linear-gradient(135deg,#16a34a,#22c55e); }
  .head.err { background:linear-gradient(135deg,#dc2626,#ef4444); }
  .head h1 { margin:0; font-size:22px; letter-spacing:.2px; }
  .head p { margin:6px 0 0; opacity:.95; font-size:13px; }
  form, .body { padding:24px 28px 28px; }
  .body { font-size:14px; line-height:1.6; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  label small { font-weight:400; color:var(--muted); }
  input, select { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; }
  input:focus, select:focus { outline:2px solid var(--accent2); border-color:transparent; }
  button { margin-top:22px; width:100%; padding:13px; border:0; border-radius:9px; background:var(--accent2);
           color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button:hover { background:#1a5fd0; }
  button.secondary { background:#fff; color:var(--accent2); border:1px solid var(--accent2); }
  button.secondary:hover { background:#eef4ff; }
  .promo-row { display:flex; gap:8px; }
  .promo-row button { margin-top:0; width:auto; padding:11px 16px; font-size:14px; }
  .promo-status { min-height:18px; margin:6px 0 0; font-size:12px; color:#16a34a; }
  .muted { color:var(--muted); }
  .hint { margin-top:16px; font-size:12px; color:var(--muted); line-height:1.5; }
  code { background:#f1f3f5; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="head">
      <h1>Example Conf</h1>
      <p>Register to attend · From One Click to One Trace</p>
    </div>
    <form id="registration" method="post" action="/register">
      <label for="name">Full name</label>
      <input id="name" name="name" required placeholder="Ada Lovelace">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required placeholder="ada@example.com">
      <label for="company">Company</label>
      <input id="company" name="company" placeholder="Analytical Engines">
      <label for="ticketType">Ticket type</label>
      <select id="ticketType" name="ticketType">
        <option value="standard">Standard</option>
        <option value="workshop">Workshop</option>
        <option value="vip">VIP</option>
      </select>
      <label for="promoCode">Promo code <small>(optional)</small></label>
      <div class="promo-row">
        <input id="promoCode" name="promoCode" placeholder="EARLYBIRD" autocomplete="off">
        <button type="button" id="applyPromo" class="secondary">Apply</button>
      </div>
      <p class="promo-status" id="promoStatus"></p>
      <button type="submit" id="submit">Register</button>
      <p class="hint">Workshop: use a made-up name and email — this session is
        being recorded. See the README for the bugs hidden in this page.</p>
    </form>
  </div>
</body>
</html>
